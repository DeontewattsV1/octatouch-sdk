name: Clang
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  install-clang:
    name: Install and verify Clang
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Clang and tooling from Ubuntu repos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang clang-tidy clang-format
      - name: Show clang version
        run: clang --version
