name: Clang
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  setup-clang:
    name: Install and verify Clang
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Clang via action
        uses: egor-tensin/setup-clang@v2.3
        with:
          version: '14'
          cc: true
      - name: Show clang version
        run: clang --version
