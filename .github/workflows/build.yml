name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang-tidy

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Latency regression check
        working-directory: build
        # Any test labelled LATENCY that exceeds 16 ms exits non-zero → blocks merge
        run: ctest -L LATENCY --output-on-failure

  lint:
    name: clang-format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find core/ platforms/ integrations/ tests/ \
            -name "*.cpp" -o -name "*.h" -o -name "*.c" | \
            xargs clang-format --dry-run --Werror
