name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Ubuntu)
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang-tidy

      - name: Configure CMake
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Run tests
        working-directory: build-ci
        run: ctest --output-on-failure

      - name: Latency regression check
        working-directory: build-ci
        # Any test labelled LATENCY that exceeds 16 ms exits non-zero → blocks merge
        run: ctest -L LATENCY --output-on-failure

  lint:
    name: clang-format check
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find core/ platforms/ integrations/ tests/ \
            \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -print0 | \
            xargs -0 clang-format --dry-run --Werror
