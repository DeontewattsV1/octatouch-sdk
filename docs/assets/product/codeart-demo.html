<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OctaTouch — CodeArt gesture demo</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#04110f;color:#fff;font-family:Inter,system-ui;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}main{position:relative;z-index:1;min-height:100vh;padding:8vw;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 75% 40%,rgba(36,240,199,.16),transparent 30%)}.e{font:700 14px monospace;letter-spacing:.25em;color:#24F0C7}h1{font:800 clamp(56px,9vw,150px) system-ui;margin:.15em 0;text-shadow:0 0 35px rgba(36,240,199,.45)}p{font-size:clamp(20px,2vw,34px);color:#dffef7}.trace{height:2px;background:linear-gradient(90deg,#24F0C7,#FFB84A,transparent);margin:40px 0;position:relative}.node{width:10px;height:10px;border-radius:50%;position:absolute;top:-4px;background:#fff;box-shadow:0 0 20px #24F0C7}.m{display:grid;grid-template-columns:repeat(12,18px);gap:8px}.t{width:18px;height:18px;border-radius:50%;background:#24F0C7;box-shadow:0 0 12px #24F0C7;animation:p 2.2s infinite alternate}@keyframes p{to{transform:translateY(-12px) scale(1.25);opacity:.25}}footer{margin-top:50px;font:13px monospace;color:#85b7ad}</style></head><body><canvas id="fx"></canvas><main><div class="e">UNIVERSAL EIGHT-CHANNEL GESTURE ENGINE</div><h1>OctaTouch</h1><p>Touch beyond boundaries.</p><div id="trace" class="trace"></div><section id="m" class="m"></section><footer>TOUCH → TRACK → RECOGNIZE → INTENT → SAFETY GATE → ACTION</footer></main><script>const c=document.querySelector('#fx'),x=c.getContext('2d');let W,H,q=[];function rs(){W=c.width=innerWidth;H=c.height=innerHeight;q=Array.from({length:88},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.2,v:(Math.random()-.5)*.4}))}rs();addEventListener('resize',rs);(function f(){x.clearRect(0,0,W,H);for(const p of q){p.y+=p.v;if(p.y<0)p.y=H;if(p.y>H)p.y=0;x.fillStyle=`rgba(70,255,220,${.07*p.z})`;x.fillRect(p.x,p.y,1.2*p.z,1.2*p.z)}requestAnimationFrame(f)})();for(let i=0;i<72;i++){const d=document.createElement('i');d.className='t';d.style.animationDelay=`${(i%12)*70}ms`;d.style.opacity=.2+(i%7)/10;m.append(d)}for(let i=0;i<6;i++){const n=document.createElement('b');n.className='node';n.style.left=`${i*18}%`;n.animate([{transform:'scale(.6)',opacity:.4},{transform:'scale(1.8)',opacity:1},{transform:'scale(.6)',opacity:.4}],{duration:1800+i*120,iterations:Infinity});trace.append(n)}</script></body></html>
